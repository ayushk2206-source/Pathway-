[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-archaeology"
version = "0.1.0"
description = "Educational AI research platform: excavate the hidden life of machine memory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["core", "backend"]